const PATTERNS = [[-2,-1,1],[-1,1,2],[-3,-1,1],[-1,1,3],[-2,1,2],[-2,-1,2]];
function fmt(v){ if (v>0) return '+'+v; if (v<0) return '−'+(-v); return '0'; }
function shuffle(a){ for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pickQuestions(){
  const idx = shuffle(POOL.map((_,i)=>i));
  const picked = [], perChar = {};
  for (const i of idx){
    const q = POOL[i];
    if ((perChar[q.slug]||0) >= 2) continue;
    perChar[q.slug] = (perChar[q.slug]||0)+1;
    picked.push(q);
    if (picked.length === 10) break;
  }
  return picked;
}
function makeChoices(v){
  const offs = PATTERNS[Math.floor(Math.random()*PATTERNS.length)];
  const ds = offs.map(o => v+o);
  return shuffle(ds.concat([v]));
}
let done = 0, correct = 0;
function render(){
  done = 0; correct = 0;
  const quiz = document.getElementById('quiz');
  quiz.innerHTML = '';
  document.getElementById('score').textContent = '';
  const questions = pickQuestions();
  questions.forEach((q, qi) => {
    const choices = makeChoices(q.value);
    const answer = choices.indexOf(q.value);
    const card = document.createElement('div'); card.className = 'card';
    card.innerHTML = `<p class="q">Q${qi+1}. ${q.char}の「${q.move}」をガードしたら？</p><div class="gifbox"><img src="${q.gif}" alt="${q.move}"></div>`;
    const ch = document.createElement('div'); ch.className = 'choices';
    const res = document.createElement('p'); res.className = 'result';
    const note = document.createElement('p'); note.className = 'note';
    choices.forEach((c, ci) => {
      const b = document.createElement('button'); b.textContent = fmt(c) + "F";
      b.onclick = () => {
        if (card.dataset.done) return; card.dataset.done = 1; done++;
        if (ci === answer) { b.classList.add('ok'); correct++; res.textContent = "○ 正解！"; }
        else { b.classList.add('ng'); ch.children[answer].classList.add('ok'); res.textContent = "× 正解は " + fmt(q.value) + "F"; }
        note.textContent = q.note || '';
        if (done === questions.length) document.getElementById('score').textContent = `結果：${questions.length}問中 ${correct}問正解`;
      };
      ch.appendChild(b);
    });
    card.appendChild(ch); card.appendChild(res); card.appendChild(note);
    quiz.appendChild(card);
  });
}
document.getElementById('retry').addEventListener('click', () => { render(); window.scrollTo({top:0}); });
render();
